[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simcore"
version = "0.1.0"
description = "High-fidelity CubeSat orbit and communications simulation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "skyfield>=1.48",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
simcore = "simcore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["simcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

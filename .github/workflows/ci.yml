name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: python -m pip install -e "engine[dev]"

      - name: Run tests
        run: python -m pytest engine -v

      - name: Smoke-test the CLI
        run: |
          simcore run scenarios/sso_3u_demo.yaml --json out/demo.json
          simcore run scenarios/iss_tle_sgp4.yaml
          simcore budget scenarios/sso_3u_demo.yaml

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run build

  desktop-windows:
    name: Desktop app (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Build engine sidecar
        run: |
          python -m pip install ./engine pyinstaller
          python scripts/build_engine.py

      - name: Smoke-test engine sidecar
        shell: bash
        run: python scripts/test_sidecar.py app/src-tauri/engine/simcore-server.exe

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Test builds are unsigned: update signing needs secrets that only the
      # release workflow (and not pull requests from forks) has.
      - name: Build desktop app
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: CubeSat-Simulator-Windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  e2e:
    name: End-to-end tests (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install engine
        run: python -m pip install -e engine

      - name: Install frontend dependencies and browser
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Run end-to-end tests
        working-directory: app
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results

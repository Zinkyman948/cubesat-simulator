name: Release

# Push a tag like v0.3.0 (after `python scripts/release.py bump 0.3.0` and a
# CHANGELOG entry) to build a signed Windows installer and publish it as a
# GitHub Release. Installed apps pick it up through latest.json.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  tests:
    name: Engine tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: python -m pip install -e "engine[dev]"
      - run: python -m pytest engine

  windows:
    name: Build and publish (Windows)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Check versions match the tag, and read release notes
        id: notes
        shell: bash
        run: |
          python scripts/release.py check "$GITHUB_REF_NAME"
          {
            echo "body<<RELEASE_NOTES_EOF"
            python scripts/release.py notes "$GITHUB_REF_NAME"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build engine sidecar
        run: |
          python -m pip install ./engine pyinstaller
          python scripts/build_engine.py

      - name: Smoke-test engine sidecar
        shell: bash
        run: python scripts/test_sidecar.py app/src-tauri/binaries/simcore-server-*.exe

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: CubeSat Simulator ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simcore"
version = "0.1.0"
description = "High-fidelity CubeSat orbit and communications simulation engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "skyfield>=1.48",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.16"]

[project.scripts]
simcore = "simcore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["simcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside skyfield's event search on NumPy >= 2.5; not our code.
    "ignore:Setting the dtype on a NumPy array:DeprecationWarning:skyfield",
]
